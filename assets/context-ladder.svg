<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">The context ladder</title>
  <desc id="d">A bar from 0 to 100 percent of the context window with checkpoints at 50, 60 and 70 percent, and what the session does at each one. After more than 5 compactions it recommends a fresh session.</desc>
  <style>
    .sans{font-family:Assistant,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800}
    .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  </style>
  <rect width="1280" height="480" fill="#EAE4D8"/>
  <rect width="1280" height="10" fill="#0E0E10"/>
  <rect y="470" width="1280" height="10" fill="#0E0E10"/>
  <text class="sans" x="40" y="70" font-size="34" fill="#0E0E10">THE CONTEXT LADDER</text>
  <text class="mono" x="40" y="104" font-size="20" fill="#57534B">one heads-up per checkpoint, never repeated</text>

  <!-- bar: x from 60 (0%) to 1220 (100%) => 11.6 px per percent -->
  <rect x="60" y="150" width="1160" height="56" fill="#EAE4D8" stroke="#0E0E10" stroke-width="6"/>
  <rect x="60" y="150" width="580" height="56" fill="#0E0E10" opacity="0.12"/>
  <rect x="640" y="150" width="116" height="56" fill="#0B71B2" opacity="0.55"/>
  <rect x="756" y="150" width="116" height="56" fill="#0B71B2"/>
  <rect x="872" y="150" width="348" height="56" fill="#0E0E10"/>
  <!-- ticks -->
  <g fill="#0E0E10">
    <rect x="637" y="138" width="6" height="80"/>
    <rect x="753" y="138" width="6" height="80"/>
    <rect x="869" y="138" width="6" height="80"/>
  </g>
  <g class="mono" font-size="20" fill="#0E0E10" text-anchor="middle">
    <text x="60" y="246" text-anchor="start">0%</text>
    <text x="640" y="246">50%</text>
    <text x="756" y="246">60%</text>
    <text x="872" y="246">70%</text>
    <text x="1220" y="246" text-anchor="end">100%</text>
  </g>

  <!-- notes under the checkpoints -->
  <g>
    <rect x="360" y="280" width="260" height="150" fill="#EAE4D8" stroke="#0E0E10" stroke-width="4"/>
    <text class="sans" x="378" y="316" font-size="22" fill="#0E0E10">50%: PLAN IT</text>
    <text class="mono" x="378" y="346" font-size="16" fill="#57534B">heads-up. Is now a safe</text>
    <text class="mono" x="378" y="368" font-size="16" fill="#57534B">moment to compact?</text>
    <text class="mono" x="378" y="390" font-size="16" fill="#57534B">Write state to files.</text>

    <rect x="650" y="280" width="260" height="150" fill="#EAE4D8" stroke="#0E0E10" stroke-width="4"/>
    <text class="sans" x="668" y="316" font-size="22" fill="#0E0E10">60%: DO IT</text>
    <text class="mono" x="668" y="346" font-size="16" fill="#57534B">second heads-up. Compact</text>
    <text class="mono" x="668" y="368" font-size="16" fill="#57534B">at the first safe point.</text>
    <text class="mono" x="668" y="390" font-size="16" fill="#57534B">User types /compact.</text>

    <rect x="940" y="280" width="280" height="150" fill="#0B71B2" stroke="#0E0E10" stroke-width="4"/>
    <text class="sans" x="958" y="316" font-size="22" fill="#EAE4D8">70%: DUE NOW</text>
    <text class="mono" x="958" y="346" font-size="16" fill="#EAE4D8">next safe point, no later.</text>
    <text class="mono" x="958" y="368" font-size="16" fill="#EAE4D8">Never wait for the window</text>
    <text class="mono" x="958" y="390" font-size="16" fill="#EAE4D8">to fill and auto-compact.</text>

    <rect x="60" y="280" width="270" height="150" fill="#EAE4D8" stroke="#0E0E10" stroke-width="4"/>
    <text class="sans" x="78" y="316" font-size="22" fill="#0E0E10">FRESH SESSION</text>
    <text class="mono" x="78" y="346" font-size="16" fill="#57534B">after more than 5</text>
    <text class="mono" x="78" y="368" font-size="16" fill="#57534B">compactions (a hook</text>
    <text class="mono" x="78" y="390" font-size="16" fill="#57534B">counts): HANDOFF.md.</text>
  </g>
</svg>
